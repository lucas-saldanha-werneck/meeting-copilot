<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Copilot</title>
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --line: #262a33; --txt: #e6e8ec; --dim: #8b909c;
    --say: #7cc4ff; --ask: #b69cff; --corr: #ffb35c; --data: #6be3a8; --warn: #ff7a7a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt); font: 14px/1.45 -apple-system, system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; }
  .pill { padding: 2px 8px; border-radius: 99px; background: var(--card); color: var(--dim); font-size: 12px; }
  .live { background: #3a1214; color: #ff9a9a; }
  #metrics { display: flex; gap: 12px; flex-wrap: wrap; color: var(--dim); font-size: 12px; }
  #metrics b { color: var(--txt); }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; padding: 12px 16px; }
  section { background: var(--card); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
  .item { padding: 8px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  .item:first-of-type { border-top: 0; }
  .item small { color: var(--dim); margin-left: 6px; }
  .new { animation: flash 2.5s ease-out; }
  @keyframes flash { from { background: #2a3140; } to { background: transparent; } }
  #say h2 { color: var(--say); } #ask h2 { color: var(--ask); }
  #corrections h2 { color: var(--corr); } #data h2 { color: var(--data); } #warnings h2 { color: var(--warn); }
  .quote { color: var(--dim); font-style: italic; }
  .empty { color: var(--dim); font-size: 12px; }
  #data .item { white-space: pre-wrap; }
  details { padding: 0 16px 16px; }
  summary { cursor: pointer; color: var(--dim); padding-top: 10px; }
  textarea { width: 100%; background: var(--card); color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; }
  button { background: #2b3242; color: var(--txt); border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .goal.ok { color: var(--data); text-decoration: line-through; }
  #lines { color: var(--dim); font-size: 12px; padding: 0 16px 8px; }
  .x { float: right; background: none; color: var(--dim); padding: 0 4px; }
  #ai { display: none; }
  #ai.ask { background: var(--say); color: var(--bg); font-weight: 600; }
  #screen, #camera { display: none; }
  #campanel { display: none; gap: 12px; align-items: flex-start; flex-wrap: wrap; padding: 0 16px 8px; color: var(--dim); font-size: 12px; }
  #camv { max-width: 220px; max-height: 140px; border: 2px solid #ff9a9a; border-radius: 6px; background: #000; }
  #campanel .on { color: #ff9a9a; font-weight: 600; }
  #screen.on, #camera.on { background: #3a1214; color: #ff9a9a; font-weight: 600; }
  #latency { color: var(--dim); font-size: 12px; }
  #vision { display: none; gap: 12px; align-items: flex-start; flex-wrap: wrap; padding: 0 16px 8px; color: var(--dim); font-size: 12px; }
  #vision figure { margin: 0; }
  #vision img { display: block; max-width: 220px; max-height: 140px; border: 1px solid var(--line); border-radius: 6px; }
  #vision .msg { color: var(--corr); max-width: 60ch; }
</style>
</head>
<body>
<header>
  <h1>Meeting Copilot</h1>
  <span id="status" class="pill">…</span>
  <span id="title" class="pill"></span>
  <div id="metrics"></div>
  <span id="latency" title="From the speech or frame reaching the copilot to the answer being ready (the page checks every 2 s)"></span>
  <button id="ai"></button>
  <button id="screen" title="Send the meeting window to the AI every 30 s or so, for this meeting only"></button>
  <button id="camera" title="Send frames from this phone's camera to the AI for this meeting, until you stop it"></button>
  <button id="pair" title="Show a code to log in another browser or device">Pair a device</button>
</header>

<div id="campanel">
  <video id="camv" playsinline muted hidden></video>
  <div>
    <div id="camstat"></div>
    <input type="file" id="camfile" accept="image/*" capture="environment" hidden>
    <button id="camshot" hidden>Take a photo</button>
  </div>
</div>

<details id="ctx">
  <summary>Objective and goals for this meeting</summary>
  <p><textarea id="goal" rows="2" placeholder="What do you want out of this meeting?"></textarea></p>
  <p><textarea id="goalsTxt" rows="4" placeholder="One goal per line"></textarea></p>
  <button id="save">Save</button> <span id="saved" class="empty"></span>
  <div id="goals"></div>
</details>

<main>
  <section id="warnings"><h2>Warnings</h2><div class="list"></div></section>
  <section id="ask"><h2>Ask this</h2><div class="list"></div></section>
  <section id="say"><h2>Say this</h2><div class="list"></div></section>
  <section id="corrections"><h2>Corrections</h2><div class="list"></div></section>
  <section id="data"><h2>Relevant facts</h2><div class="list"></div></section>
</main>
<div id="vision"></div>
<div id="lines"></div>

<script>
const seen = new Set();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hhmm = ts => new Date(ts * 1000).toTimeString().slice(0, 5);

function list(id, items, render, emptyText = "nothing yet") {
  const el = document.querySelector(`#${id} .list`);
  if (!items.length) { el.innerHTML = `<div class="empty">${esc(emptyText)}</div>`; return; }
  el.innerHTML = items.slice().reverse().map(it => {
    const key = id + it.ts + (it.text || it.quote || it.markdown || "");
    const cls = seen.has(key) ? "item" : "item new";
    seen.add(key);
    return `<div class="${cls}">${render(it)}</div>`;
  }).join("");
}

let editing = false;
let last = {}, aiMsg = "", screenMsg = "";
async function refresh() {
  let e;
  try {
    const r = await fetch("/state");
    if (r.status === 401) { location.reload(); return; }   // logged out: the login page asks for a code
    e = await r.json();
  }
  catch { document.getElementById("status").textContent = "copilot stopped"; return; }
  const st = document.getElementById("status");
  st.textContent = e.status; st.className = "pill" + (e.live ? " live" : "");
  document.getElementById("title").textContent = e.meeting ? e.meeting.title : "";
  last = e;
  const ai = document.getElementById("ai");
  ai.style.display = e.confirm_ai ? "inline-block" : "none";
  ai.className = e.ai_on || e.ai_next ? "" : "ask";
  if (!aiMsg) ai.textContent = e.ai_on ? "AI on · stop" : e.ai_next ? "AI on for the next meeting · cancel"
    : e.live ? "Turn on AI for this meeting" : "Turn on AI for the next meeting";
  const v = e.vision || {}, lat = e.latency || {};
  const sb = document.getElementById("screen");
  sb.style.display = v.screen && e.live ? "inline-block" : "none";
  sb.className = v.screen_on ? "on" : "";
  if (!screenMsg) sb.textContent = v.screen_on ? "Screen shared with AI · stop" : "Share screen with AI";
  cameraUI(e, v);
  document.getElementById("latency").textContent = lat.n ?
    `last answer ${lat.last} s · median ${lat.median} s` + (lat.n_image ? `, with image ${lat.median_image} s` : "") : "";
  const vis = document.getElementById("vision");
  const used = v.used || [];
  const showVision = (v.screen_on || used.length || v.screen_msg) && e.live;
  vis.style.display = showVision ? "flex" : "none";
  if (showVision) {
    const key = JSON.stringify([used, v.screen_msg, v.screen_on]);
    if (vis.dataset.key !== key) {
      vis.dataset.key = key;
      vis.innerHTML = (v.screen_msg ? `<div class="msg">${esc(v.screen_msg)}</div>` : "") +
        used.map(f => `<figure><img alt="" src="/frame?id=${Number(f.id)}"><figcaption>AI saw: ${f.source === "screen" ? "screen" : "camera"} ${esc(new Date(f.ts * 1000).toTimeString().slice(0, 8))}</figcaption></figure>`).join("") +
        (!used.length && v.screen_on && !v.screen_msg ? "<div>Screen shared: the first frame goes with the next answer.</div>" : "");
    }
  }
  const m = e.metrics || {};
  document.getElementById("metrics").innerHTML = m.minutes == null ? "" :
    `<span><b>${m.minutes}</b> min</span><span>you <b>${m.you_pct}%</b> (5 min: <b>${m.you_pct_5min}%</b>)</span>` +
    `<span><b>${m.questions}</b> questions</span><span><b>${m.wpm}</b> words/min</span>` +
    (m.monologue_s >= 30 ? `<span>monologue <b>${m.monologue_s}s</b></span>` : "");

  list("say", e.say, it => `${esc(it.text)}<small>${hhmm(it.ts)}</small>`);
  list("ask", e.ask, it => `${esc(it.text)}<small>${hhmm(it.ts)}</small>`);
  list("corrections", e.corrections, it =>
    `<div class="quote">"${esc(it.quote)}"</div><div>${esc(it.problem)}</div><div>→ ${esc(it.suggestion)}<small>${hhmm(it.ts)}</small></div>`);
  list("data", e.data, it => `${esc(it.markdown)}<small>${hhmm(it.ts)}</small>`,
    e.data_enabled ? "nothing yet" : "fact search is off (see README: search folders / MCP)");
  list("warnings", e.warnings, it =>
    `<button class="x" title="do not show this kind again" data-kind="${esc(it.kind)}">✕</button>${esc(it.text)}<small>${hhmm(it.ts)}</small>`);

  document.getElementById("goals").innerHTML = (e.goals || []).map(x =>
    `<div class="goal ${x.covered ? "ok" : ""}">${x.covered ? "✓" : "○"} ${esc(x.text)}</div>`).join("");
  if (!editing) {
    document.getElementById("goal").value = e.goal || "";
    document.getElementById("goalsTxt").value = (e.goals || []).map(x => x.text).join("\n");
  }
  document.getElementById("lines").innerHTML = (e.lines || []).slice(-3).map(f =>
    `<div>${f.who === "You" ? "You" : "Others"}: ${esc(f.text)}</div>`).join("") +
    (e.errors || []).map(x => `<div style="color:var(--warn)">${esc(x)}</div>`).join("");
}

// ---- phone camera: a live preview, one frame every camera_s seconds (only when it changed), upload as JPEG
const cam = { stream: null, timer: null, wake: null, prev: null, lastSent: 0, n: 0, bytes: 0, msg: "", busy: false };
const camSecure = !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
const camEl = id => document.getElementById(id);
const camChanged = (a, b) => {
  if (!a || a.length !== b.length) return true;
  let sum = 0, big = 0;
  for (let i = 0; i < a.length; i++) { const d = Math.abs(a[i] - b[i]); sum += d; if (d > 40) big++; }
  return sum / a.length >= 2 || big >= 2;
};
function camThumb(src, w, h) {
  const c = document.createElement("canvas"); c.width = 32; c.height = 24;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(src, 0, 0, 32, 24);
  const px = x.getImageData(0, 0, 32, 24).data, g = [];
  for (let i = 0; i < px.length; i += 4) g.push((px[i] * 299 + px[i + 1] * 587 + px[i + 2] * 114) / 1000);
  return g;
}
function camPaint() {
  const on = !!cam.stream;
  const kb = Math.round(cam.bytes / 1024);
  camEl("camstat").innerHTML = (on ? `<span class="on">Camera on</span> · a frame every ${(last.vision || {}).camera_s || 5} s when the picture changed · sent ${cam.n} (${kb} KB)` : "") +
    (cam.msg ? `<div style="color:var(--corr)">${esc(cam.msg)}</div>` : "") +
    (!camSecure && (last.vision || {}).camera_on ? ((last.vision || {}).https
      ? `<div>Live video needs https: set this phone up once at <a href="/setup" style="color:var(--say)">/setup</a>. Until then: one photo per tap.</div>`
      : `<div>Live video needs https (off on this Mac): one photo per tap.</div>`) : "");
}
async function camSend(blob, manual) {
  if (cam.busy) return;
  cam.busy = true;
  try {
    const r = await fetch("/camera/frame", { method: "POST", headers: { "Content-Type": blob.type || "image/jpeg" }, body: blob });
    if (r.status === 401) { location.reload(); return; }
    if (r.ok) { cam.n++; cam.bytes += blob.size; cam.msg = ""; cam.lastSent = Date.now(); }
    else if (r.status !== 429 || manual) {   // a live frame that came too soon is just skipped; a photo says so
      let t = ""; try { t = (await r.json()).error || ""; } catch {}
      cam.msg = t || "the Mac did not take the frame";
      if (r.status === 409) { camStopLocal(); refresh(); }
    }
  } catch { cam.msg = "could not reach the Mac"; }
  finally { cam.busy = false; camPaint(); }
}
async function camGrab(force) {
  const v = camEl("camv");
  if (!cam.stream || !v.videoWidth) return;
  const k = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  const t = camThumb(c);
  const keepalive = Date.now() - cam.lastSent >= 60000;   // an unchanged scene is re-announced once a minute so it stays current
  if (!force && !keepalive && !camChanged(cam.prev, t)) return;
  cam.prev = t;
  c.toBlob(b => { if (b) camSend(b); }, "image/jpeg", 0.7);
}
function camStopLocal() {
  if (cam.timer) clearInterval(cam.timer);
  cam.timer = null;
  if (cam.stream) cam.stream.getTracks().forEach(t => t.stop());
  cam.stream = null; cam.prev = null;
  if (cam.wake) { try { cam.wake.release(); } catch {} cam.wake = null; }
  const v = camEl("camv"); v.srcObject = null; v.hidden = true;
  camPaint();
}
async function camStart() {
  cam.msg = "";
  if (!camSecure) { camPaint(); return; }
  try {
    cam.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  } catch (ex) {
    cam.msg = "the camera was not allowed: " + (ex && ex.name || "error");
    await post("/camera", { on: false }).catch(() => {});
    camPaint(); return;
  }
  const v = camEl("camv"); v.srcObject = cam.stream; v.hidden = false;
  try { await v.play(); } catch {}
  try { if (navigator.wakeLock) cam.wake = await navigator.wakeLock.request("screen"); } catch {}
  cam.n = 0; cam.bytes = 0; cam.lastSent = 0;
  cam.timer = setInterval(() => camGrab(false), ((last.vision || {}).camera_s || 5) * 1000);
  setTimeout(() => camGrab(true), 600);
  camPaint();
}
async function camToggle() {
  const on = !((last.vision || {}).camera_on);
  let r = null;
  try { r = await post("/camera", { on, meeting: last.meeting ? last.meeting.id : null }); } catch {}
  if (!r || !r.ok) {
    let t = ""; if (r && r.status === 409) { try { t = await r.text(); } catch {} }
    cam.msg = (t && t !== "meeting changed") ? t : "did not work, try again";
    camPaint(); refresh(); return;
  }
  if (on) { await camStart(); } else { camStopLocal(); }
  refresh();
}
function cameraUI(e, v) {
  const b = camEl("camera"), live = !!(v.camera && e.live);
  b.style.display = live ? "inline-block" : "none";
  b.className = v.camera_on ? "on" : "";
  b.textContent = v.camera_on ? "Camera on · stop" : "Camera";
  // the meeting ended or the Mac says it is off: stop the stream at once
  if (cam.stream && !(live && v.camera_on)) camStopLocal();
  const showShot = live && v.camera_on && !camSecure;
  camEl("camshot").hidden = !showShot;
  camEl("campanel").style.display = live && (v.camera_on || cam.msg) ? "flex" : "none";
  camPaint();
}
camEl("camera").onclick = camToggle;
camEl("camshot").onclick = () => camEl("camfile").click();
camEl("camfile").onchange = async ev => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!f) return;
  try {
    const bmp = await createImageBitmap(f);
    const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    c.toBlob(b => { if (b) camSend(b, true); }, "image/jpeg", 0.7);
  } catch { cam.msg = "could not read that photo"; camPaint(); }
};
// leaving the page (or the phone locking) turns the camera off, on the Mac too (keepalive: the request
// still goes out while the page is being frozen or closed)
const camHide = () => { if (cam.stream) { camStopLocal(); post("/camera", { on: false }, true).catch(() => {}); } };
document.addEventListener("visibilitychange", () => { if (document.hidden) camHide(); });
window.addEventListener("pagehide", camHide);

const post = (path, body, keepalive) =>
  fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), keepalive: !!keepalive });

document.getElementById("ai").onclick = async () => {
  const body = { on: !(last.ai_on || last.ai_next), meeting: last.live && last.meeting ? last.meeting.id : null };
  let ok = false;
  try { ok = (await post("/ai", body)).ok; } catch {}
  if (!ok) {
    aiMsg = "did not work, try again";
    document.getElementById("ai").textContent = aiMsg;
    setTimeout(() => aiMsg = "", 2500);
  }
  refresh();
};
document.getElementById("screen").onclick = async () => {
  const body = { on: !(last.vision || {}).screen_on, meeting: last.meeting ? last.meeting.id : null };
  let ok = false;
  try { ok = (await post("/screen", body)).ok; } catch {}
  if (!ok) {
    screenMsg = "did not work, try again";
    document.getElementById("screen").textContent = screenMsg;
    setTimeout(() => screenMsg = "", 2500);
  }
  refresh();
};
document.getElementById("pair").onclick = async () => {
  const b = document.getElementById("pair");
  try {
    const e = await (await post("/pair", {})).json();
    b.textContent = `Code: ${e.code} (valid ${Math.ceil(e.expires_in / 60)} min)`;
  } catch { b.textContent = "did not work, try again"; }
  setTimeout(() => b.textContent = "Pair a device", 60000);
};
document.getElementById("warnings").addEventListener("click", ev => {
  const b = ev.target.closest("button.x");
  if (b) post("/mute", { kind: b.dataset.kind });
});
for (const id of ["goal", "goalsTxt"]) {
  document.getElementById(id).addEventListener("focus", () => editing = true);
}
document.getElementById("save").onclick = async () => {
  let ok = false;
  try {
    ok = (await post("/context", {
      goal: document.getElementById("goal").value,
      goals: document.getElementById("goalsTxt").value.split("\n"),
    })).ok;
  } catch {}
  // not saved: keep your text in the boxes (the next refresh would replace it) and say so
  editing = !ok;
  document.getElementById("saved").textContent = ok ? "saved" : "not saved, try again";
  setTimeout(() => document.getElementById("saved").textContent = "", ok ? 2000 : 6000);
};
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>

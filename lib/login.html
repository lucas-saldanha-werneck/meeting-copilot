<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Copilot</title>
<style>
  :root { --bg: #0f1115; --card: #181b22; --line: #262a33; --txt: #e6e8ec; --dim: #8b909c; --say: #7cc4ff; --warn: #ff7a7a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--txt);
         font: 15px/1.45 -apple-system, system-ui, sans-serif; padding: 16px; }
  form { background: var(--card); border-radius: 12px; padding: 24px; width: 100%; max-width: 340px; }
  h1 { font-size: 17px; margin: 0 0 6px; }
  p { color: var(--dim); margin: 0 0 16px; }
  input { width: 100%; font: 600 28px/1 ui-monospace, Menlo, monospace; letter-spacing: .3em; text-align: center;
          padding: 12px; background: var(--bg); color: var(--txt); border: 1px solid var(--line); border-radius: 8px; }
  button { width: 100%; margin-top: 12px; padding: 10px; font: inherit; font-weight: 600; border: 0; border-radius: 8px;
           background: var(--say); color: var(--bg); cursor: pointer; }
  button.link { background: none; color: var(--dim); font-weight: 400; margin-top: 8px; }
  #msg { min-height: 1.4em; margin: 10px 0 0; color: var(--warn); }
  #msg.ok { color: var(--dim); }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Meeting Copilot</h1>
  <p>Type the 6-digit code shown on the Mac.</p>
  <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="7" required autofocus
         aria-label="6-digit code">
  <button type="submit">Open</button>
  <button type="button" class="link" id="again">Show the code on the Mac again</button>
  <div id="msg" role="status"></div>
</form>
<script>
const msg = (text, ok) => { const m = document.getElementById("msg"); m.textContent = text; m.className = ok ? "ok" : ""; };
const post = (path, body) =>
  fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

document.getElementById("f").onsubmit = async ev => {
  ev.preventDefault();
  const code = document.getElementById("code").value.replace(/\D/g, "");
  if (code.length !== 6) return msg("The code has 6 digits.");
  let r;
  try { r = await post("/login", { code }); } catch { return msg("The copilot is not answering."); }
  if (r.ok) {
    // back to the address that was opened, without an old ?token= or ?once= in it
    const u = new URL(location.href);
    u.searchParams.delete("token"); u.searchParams.delete("once");
    // "/" + the path without its leading slashes: never "//other.site", which would leave this site
    return location.replace("/" + u.pathname.replace(/^\/+/, "") + u.search);
  }
  let e = {};
  try { e = await r.json(); } catch {}
  msg(e.error || "That did not work. Try again.");
  document.getElementById("code").select();
};
document.getElementById("again").onclick = async () => {
  let r;
  try { r = await post("/login/code", {}); } catch { return msg("The copilot is not answering."); }
  if (r.ok) return msg("Look for the notification on the Mac, or run: meeting-copilot status", true);
  let e = {};
  try { e = await r.json(); } catch {}
  msg(e.error || "That did not work. Try again.");
};
</script>
</body>
</html>
